apiVersion: v1
kind: Service
metadata:
  name: estate-ci-api
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: estate-ci-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: estate-ci-web
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: estate-ci-web}
  ports: [{name: http, port: 3000, targetPort: http}]
